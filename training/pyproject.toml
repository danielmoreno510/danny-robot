[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "danny-training"
version = "0.1.0"
description = "Entrenamiento de Robot Danny con mjlab (etapa 4)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Igual que xgoduck_rl: BAM exige Python <3.13.
requires-python = ">=3.12, <3.13"
dependencies = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    # Distribución de BAM; el import sigue siendo `bam`.
    "better-actuator-models",
    "onnxruntime>=1.24.4",
    "matplotlib>=3.10.9",
    "scipy>=1.16",
    "torch==2.9.1",
]

[project.entry-points."mjlab.tasks"]
danny_training = "danny_training.tasks"

[tool.uv]
override-dependencies = [
    "protobuf>=4.0,<7.0",
    "onnx>=1.20.1",
    "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
better-actuator-models = { path = "vendor/bam", editable = true }
# PyPI trae torch solo para CPU en Windows: la GPU necesita el índice de PyTorch.
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
# explicit: solo los paquetes que lo nombran salen de este índice.
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
